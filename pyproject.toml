[project]
name = "fraud-detection"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "imblearn>=0.0",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pydantic-settings>=2.15.0",
